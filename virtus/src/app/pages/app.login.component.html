<p-toast key="tst" [baseZIndex]="99999"></p-toast>

<div class="login-body" style="display: flex; justify-content: center;">
  <div class="login-panel"
       style="position: absolute; top: 50%; transform: translate(0, -50%); height: auto; display: flex;align-items: stretch;">
    <img src="assets/layout/images/imagesVirtus/logoVirtus.svg" alt="harmony-layout" class="mobile"
         style="width: 45%; margin: auto; margin-top: 2rem;"/>
    <div class="left-part">
      <span class="login-panel-header">Iniciar sesión en Virtus</span>
      <span class="login-panel-subheader">Bienvenido, por favor utilice el formulario para ingresar a Virtus. <a
        routerLink="/" class="text-blue-500"> Inicio </a> </span>
      <div class="mt-3">
        <div class="field">
          <label>Correo electrónico / usuario:</label>
          <input type="text" autocomplete="off" pInputText [(ngModel)]="user.email" class="w-full"/>
        </div>
        <div class="field">
          <label>Ingrese Contraseña:</label>
          <input type="password" autocomplete="new-password" pInputText feedback="false" class="w-full"
                 [(ngModel)]="user.password"/>
        </div>
      </div>
      <div class="col-12 text-center">
        <button type="button" pButton label="Acceder" class="p-button-raised w-full " (click)="login()"></button>
        <div class="text-center mb-2">
          <button pButton class="mt-3 border-0" icon="pi pi-facebook" label="Facebook"
                  style="background: #1771E6"></button>
          <button pButton class="ml-3 mt-3 border-0" icon="pi pi-google" label="Google"
                  style="background: #DE4032"></button>
        </div>
        <span style="cursor: pointer" class="text-blue-500"
              (click)="openDialogForgotPassword()"> ¿Olvido su contraseña?</span> <br>
        <span> ¿No tiene una cuenta? </span> <a routerLink="/singup" class="text-green-500"> Registrarse </a>
      </div>
    </div>
    <div class="right-part bg-blue-50" style="width: 50%;box-sizing: border-box;padding: 36px 75px 36px 36px;
  background: url('assets/layout/images/imagesVirtus/nuevoFondoLogin.jpg'); background-repeat: no-repeat; background-attachment: fixed;
  background-size: cover;">
    </div>
  </div>
</div>

<p-dialog [(visible)]="forgotPassword_dialog" [style]="{width: '450px'}" header="Recuperar cuenta" [modal]="true"
          class="p-fluid">
  <ng-template pTemplate="content">
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="off" pInputText [(ngModel)]="user.email" class="w-full"/>
    </div>
    <span> ¿Ya tiene código de verificación? <span class="text-green-500" style="cursor: pointer"
                                                   (click)="openDialogHasCode()"> click aquí. </span> </span>
  </ng-template>
  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-warning"></button>
    <button pButton pRipple label="Guardar cambios" icon="pi pi-check" class="p-button-success"></button>
  </ng-template>
</p-dialog>

<p-dialog [(visible)]="alreadyHasCode" [style]="{width: '450px'}" header="Cambiar contrseña" [modal]="true"
          class="p-fluid">
  <ng-template pTemplate="content">
    <div class="field">
      <label for="emailhascode">Correo electrónico</label>
      <input id="emailhascode" type="email" autocomplete="off" pInputText [(ngModel)]="user.email" class="w-full"/>
    </div>
    <div class="field">
      <label for="code">Código de verificación</label>
      <input id="code" type="text" autocomplete="off" pInputText class="w-full"/>
    </div>
    <div class="field">
      <label>Contraseña:</label>
      <input type="password" autocomplete="off" pInputText class="w-full"/>
    </div>
    <div class="field">
      <label>Confirmar contraseña:</label>
      <input type="password" autocomplete="off" pInputText class="w-full"/>
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-warning"></button>
    <button pButton pRipple label="Guardar cambios" icon="pi pi-check" class="p-button-success"></button>
  </ng-template>
</p-dialog>
