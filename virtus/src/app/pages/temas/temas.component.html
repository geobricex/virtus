<div class="card">
  <p-dataView #dv [value]="temas" [paginator]="true" [rows]="6" filterBy="name"
              layout="grid">
    <ng-template pTemplate="header">
      <div class="grid grid-nogutter flex-column md:flex-row justify-content-between">
        <p-dropdown placeholder="Ordenar por:" (onChange)="onSortChange($event)" styleClass="mb-2 md:mb-0"></p-dropdown>
        <span class="p-input-icon-left mb-2 md:mb-0">
                    <i class="pi pi-search"></i>
                    <input type="search" pInputText placeholder="Buscador...">
                </span>
        <p-dataViewLayoutOptions></p-dataViewLayoutOptions>
      </div>
    </ng-template>

    <ng-template let-tema pTemplate="listItem">
      <div class="col-12">
        <div class="flex flex-column md:flex-row align-items-center p-3 w-full">
          <img [src]="tema.pathimgTopic" [alt]="tema.nameTopic" width="100" height="100"
               class="my-4 md:my-0 w-9 md:w-10rem shadow-2 mr-5"/>
          <div class="flex-1 text-center md:text-left">
            <div class="font-bold text-2xl">{{tema.nameTopic}}</div>
            <div class="mb-3">{{tema.descriptionTopic}}</div>
            <!--<p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>-->
            <i class="pi pi-tag mr-2"></i><span class="font-semibold">{{tema.nameTopic}}</span>
          </div>
          <div
            class="flex flex-row md:flex-column justify-content-between w-full md:w-auto align-items-center md:align-items-end mt-5 md:mt-0">
            <button pButton icon="pi pi-desktop" label="Ver evaluaciones" class="mb-2 p-button p-button-info"
                    routerLink="themes"></button>
            <!-- <span class="product-price">${{product.price}}</span>
            <span [class]="'product-badge status-' + product.inventoryStatus.toLowerCase()">{{product.inventoryStatus}}</span>-->
          </div>
        </div>
      </div>
    </ng-template>

    <ng-template let-tema pTemplate="gridItem">
      <div class="col-12 md:col-4">
        <div class="card m-3 border-1 surface-border">
          <div class="flex align-items-center justify-content-between">
            <div class="flex align-items-center">
              <i class="pi pi-tag mr-2"></i>
              <span class="font-semibold">{{tema.nameTopic}}</span>
            </div>
            <!--<span [class]="'product-badge status-' + tema.inventoryStatus.toLowerCase()">{{product.inventoryStatus}}</span>-->
          </div>
          <div class="text-center">
            <img [src]="tema.pathimgTopic" [alt]="tema.nameTopic" width="200" height="200"
                 class="w-9 shadow-2 my-3 mx-0"/>
            <div class="text-2xl font-bold">{{tema.nameTopic}}</div>
            <div class="mb-3">{{tema.descriptionTopic}}</div>
            <!--<p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>-->
          </div>
          <div class="flex align-items-center justify-content-between">
            <button pButton icon="pi pi-desktop" label="Ver evaluaciones" class="mb-2 p-button p-button-info"
                    routerLink="themes"></button>
            <!--<span class="product-price">${{product.price}}</span>
            <p-button icon="pi pi-shopping-cart" [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"></p-button>-->
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataView>
</div>
