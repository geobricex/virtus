<div class="grid">
  <div class="col-12">
    <div class="card">
      <p-toast></p-toast>
      <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
          <div class="my-2">
            <button pButton pRipple label="Nuevo curso" icon="pi pi-plus" class="p-button-success mr-2"
                    (click)="openNew()"></button>
          </div>
        </ng-template>
      </p-toolbar>

      <p-dataView #dv [value]="courses" [paginator]="true" [rows]="9" filterBy="name"
                  layout="grid">
        <ng-template pTemplate="header">
          <div class="grid grid-nogutter flex-column md:flex-row justify-content-between">
            <p-dropdown placeholder="Ordenar por:" (onChange)="onSortChange($event)"
                        styleClass="mb-2 md:mb-0"></p-dropdown>
            <span class="p-input-icon-left mb-2 md:mb-0">
                    <i class="pi pi-search"></i>
                    <input type="search" pInputText placeholder="Buscador...">
                </span>
            <p-dataViewLayoutOptions></p-dataViewLayoutOptions>
          </div>
        </ng-template>

        <ng-template let-course pTemplate="listItem">
          <div class="col-12">
            <div class="flex flex-column md:flex-row align-items-center p-3 w-full">
              <img [src]="course.pathimgCourse" [alt]="course.nameCourse" width="100"
                   class="my-4 md:my-0 w-9 md:w-10rem shadow-2 mr-5"/>
              <div class="flex-1 text-center md:text-left">
                <div class="font-bold text-2xl">{{course._nameCourse}}</div>
                <div class="mb-3">{{course.descriptionCourse}}</div>
                <!--<p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>-->
                <i class="pi pi-tag mr-2"></i><span class="font-semibold">{{course.nameCourse}}</span>
              </div>
              <div
                class="flex flex-row md:flex-column justify-content-between w-full md:w-auto align-items-center md:align-items-end mt-5 md:mt-0">
                <p-button icon="pi pi-share-alt" label="Unirme al curso" class="mb-2"></p-button>
                <!-- <span class="product-price">${{product.price}}</span>
                <span [class]="'product-badge status-' + product.inventoryStatus.toLowerCase()">{{product.inventoryStatus}}</span>-->
              </div>
            </div>
          </div>
        </ng-template>

        <ng-template let-course pTemplate="gridItem">
          <div class="col-12 md:col-4">
            <div class="card m-3 border-1 surface-border">
              <div class="flex align-items-center justify-content-between">
                <div class="flex align-items-center">
                  <i class="pi pi-tag mr-2"></i>
                  <span class="font-semibold">{{course.nameCourse}}</span>
                </div>
                <!--<span [class]="'product-badge status-' + course.inventoryStatus.toLowerCase()">{{product.inventoryStatus}}</span>-->
              </div>
              <div class="text-center">
                <img [src]="course.pathimgCourse" [alt]="course.nameCourse" width="100" height="150"
                     class="w-9 shadow-2 my-3 mx-0"/>
                <div class="text-2xl font-bold">{{course.nameCourse}}</div>
                <div class="mb-3">{{course.descriptionCourse}}</div>
                <!--<p-rating [ngModel]="product.rating" [readonly]="true" [cancel]="false"></p-rating>-->
              </div>
              <div class="flex align-items-center justify-content-between">
                <p-button icon="pi pi-share-alt" label="Unirme al curso" class="mb-2"></p-button>
                <!--<span class="product-price">${{product.price}}</span>
                <p-button icon="pi pi-shopping-cart" [disabled]="product.inventoryStatus === 'OUTOFSTOCK'"></p-button>-->
              </div>
            </div>
          </div>
        </ng-template>
      </p-dataView>

    </div>
  </div>
</div>

<p-dialog [(visible)]="newcourse_dialog" [style]="{width: '450px'}" header="Nuevo curso" [modal]="true"
          class="p-fluid">
  <ng-template pTemplate="content">
    <p-panel header="Datos principales" [toggleable]="true" class="line-height-3 mb-2"
             style="margin-bottom: 2rem !important">
      <div class="field">
        <label for="email">Nombre:</label>
        <input id="email" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>
      <div class="field">
        <label for="desc">Descripción:</label>
        <textarea pInputTextarea name="" id="desc" cols="30" rows="5"></textarea>
      </div>
      <div class="field">
        <label for="pclave">Palabras clave:</label>
        <input id="pclave" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>
    </p-panel>
    <p-panel header="Modulos" [toggleable]="true" class="line-height-3 mb-2" [collapsed]="true">
      <div class="field">
        <label for="nombrem">Nombre:</label>
        <input id="nombrem" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>
      <div class="field">
        <label for="descm">Descripción:</label>
        <textarea pInputTextarea name="" id="descm" cols="30" rows="5"></textarea>
      </div>
      <div class="field">
        <label for="pclavem">Palabras clave:</label>
        <input id="pclavem" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>

      <button pButton pRipple label="Agregar" icon="pi pi-new" class="p-button-info mb-2"></button>

      <div class="field">
        <div class="flex align-items-center flex-column sm:flex-row">
          <p-chip label="Modulo 1" styleClass="m-1"></p-chip>
          <p-chip label="Modulo 2" styleClass="m-1"></p-chip>
          <p-chip label="Modulo 3" styleClass="m-1"></p-chip>
          <p-chip label="Modulo 4" styleClass="m-1" [removable]="true"></p-chip>
        </div>
      </div>
    </p-panel>
    <p-panel header="Temas" [toggleable]="true" class="line-height-3 m-0" [collapsed]="true">
      <div class="field">
        <label for="nombret">Seleccione un modulo:</label>
        <p-dropdown id="status" optionLabel="label" placeholder="Modulos...">
          <ng-template pTemplate="selectedItem">
            <span [class]="'product-badge'"> Modulos... </span>
          </ng-template>
        </p-dropdown>
      </div>
      <div class="field">
        <label for="nombret">Nombre:</label>
        <input id="nombret" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>
      <div class="field">
        <label for="desct">Descripción:</label>
        <textarea pInputTextarea name="" id="desct" cols="30" rows="5"></textarea>
      </div>
      <div class="field">
        <label for="pclavet">Palabras clave:</label>
        <input id="pclavet" type="email" autocomplete="off" pInputText class="w-full"/>
      </div>
      <button pButton pRipple label="Agregar" icon="pi pi-new" class="p-button-info mb-2"></button>

      <div class="field">
        <div class="flex align-items-center flex-column sm:flex-row">
          <p-chip label="Tema 1" styleClass="m-1"></p-chip>
          <p-chip label="Tema 2" styleClass="m-1"></p-chip>
          <p-chip label="Tema 3" styleClass="m-1"></p-chip>
          <p-chip label="Tema 4" styleClass="m-1" [removable]="true"></p-chip>
        </div>
      </div>
    </p-panel>
  </ng-template>
  <ng-template pTemplate="footer">
    <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-warning"></button>
    <button pButton pRipple label="Guardar cambios" icon="pi pi-check" class="p-button-success"></button>
  </ng-template>
</p-dialog>
