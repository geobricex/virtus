    <a id="topbar-profile-menu-button" href="#" (click)="app.onTopbarMenuButtonClick($event)">
      <img [src]="user.pathimg_person" alt="harmony-layout" class="topbar-profile"
           style="border-radius: 50%"/>
      <span
      >{{user.name_person !== undefined ? user.name_person : ''}} {{user.last_name !== undefined ? user.last_name : ''}}</span>

      <span
        class="p-badge p-badge-success ml-1">{{user.type_person === 'U' ? 'Usuario' : user.type_person === 'A' ? 'Administrador' : 'Root'}}</span>
    </a>
    <ul id="topbar-profile-menu" class="animated fadeInDown"
        [ngClass]="{'topbar-profile-menu-active': app.topbarMenuActive}">
      <li #theme [ngClass]="{'menuitem-active':app.activeTopbarItem === theme}">
        <a routerLink="/app/myprofile" (click)="app.onTopbarItemClick($event, theme)">
          <i class="pi pi-user topbar-icon-calendar"></i>
          <span class="topbar-item-name">Perfil</span>
        </a>
        <a routerLink="/login" (click)="app.onTopbarItemClick($event, theme)">
          <i class="pi pi-cog topbar-icon-settings"></i>
          <span class="topbar-item-name">Configuración</span>
        </a>
        <a (click)="showDialog()">
          <i class="pi pi-cog topbar-icon-settings"></i>
          <span class="topbar-item-name">Accesibilidad</span>
        </a>
        <a (click)="logout()">
          <i class="topbar-icon pi pi-fw pi-sign-out"></i>
          <span class="topbar-item-name">Cerrar Sesion</span>
        </a>
      </li>
    </ul>
